<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شكراً لتواصلكم | د. محمد النجار</title>
  <meta name="robots" content="noindex, follow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f4c81;
      --secondary: #1b75bc;
      --accent: #22c55e;
      --text-dark: #1e293b;
      --bg-light: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      max-width: 550px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
      border-top: 6px solid var(--primary);
    }
    .icon-wrap {
      width: 80px;
      height: 80px;
      background: #dcfce7;
      color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 {
      font-size: 26px;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 800;
    }
    p {
      font-size: 16px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .info-box {
      background: #f1f5f9;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 28px;
      font-size: 14px;
      color: var(--text-dark);
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 700;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background-color: var(--secondary);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon-wrap">✓</div>
    <h1>تم استلام طلبك بنجاح!</h1>
    <p>شكراً لتواصلك مع مركز د. محمد النجار استشاري القرنية قام فريقنا بتسجيل بياناتك وسنقوم بالتواصل معك عبر الهاتف خلال 24 ساعة لتأكيد موعد الكشف.</p>
    
    <div class="info-box">
      <strong>📞 هل لديك حالة طارئة؟</strong><br>
      يمكنك الاتصال مباشرة بفريق المتابعة على الرقم: <strong>01113524230</strong>
    </div>

    <a href="https://www.corneaegypt.com/ar/index.html/" class="btn">العودة للصفحة الرئيسية</a>
  </div>

</body>
</html>
